name: AirGap Mathematical Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Fountain Code & QR Engine Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Run Fountain Code Mathematical Verification Suite
      run: node tests/test-fountain.js

    - name: Run Standalone QR Matrix Generator Test Suite
      run: node tests/test-qr.js
